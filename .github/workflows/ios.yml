name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Latest Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.3'
          cache: true

      - name: Fix iOS Files for New Flutter
        run: |
          echo "Fixing AppDelegate.swift..."
          cat > ios/Runner/AppDelegate.swift << 'EOF'
          import Flutter
          import UIKit
          
          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          EOF
          
          echo "Removing SceneDelegate if exists..."
          rm -f ios/Runner/SceneDelegate.swift
          
          echo "Cleaning old build..."
          flutter clean
          rm -Rf ios/Pods
          rm -f ios/Podfile.lock

      - name: Get packages
        run: flutter pub get

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Create IPA for Sideloadly
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r -y billing-app.ipa Payload
          ls -lh billing-app.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: billing-app-ipa
          path: build/ios/iphoneos/billing-app.ipa
          retention-days: 7
