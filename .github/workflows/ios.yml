name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter 3.27.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r -y billing-app.ipa Payload
          ls -lh billing-app.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: billing-app-ipa
          path: build/ios/iphoneos/billing-app.ipa
          retention-days: 7
